{{- if .Values.backpressure.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-bug-agent.fullname" . }}-backpressure
  labels:
    {{- include "kube-bug-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kube-bug-agent.selectorLabels" (dict "root" . "component" "backpressure") | nindent 4 }}
  ports:
    - name: proxy
      port: {{ .Values.backpressure.service.port }}
      targetPort: proxy
{{- end }}
