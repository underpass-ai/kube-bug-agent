{{- if .Values.investigator.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-bug-agent.fullname" . }}-collector-headless
  labels:
    {{- include "kube-bug-agent.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "kube-bug-agent.selectorLabels" (dict "root" . "component" "investigator") | nindent 4 }}
  ports:
    - name: http
      port: 8787
      targetPort: http
{{- end }}
