{{- if and .Values.investigator.enabled .Values.investigator.kubernetes.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-bug-agent.fullname" . }}-reader
  labels:
    {{- include "kube-bug-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-bug-agent.fullname" . }}-collector
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-bug-agent.fullname" . }}-reader
{{- end }}
