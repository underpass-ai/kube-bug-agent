{{- if and .Values.investigator.enabled .Values.investigator.kubernetes.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-bug-agent.fullname" . }}-reader
  labels:
    {{- include "kube-bug-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
{{- end }}
